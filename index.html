<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YFD 产品售后中心</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
</head>
<body>
  <div class="bg-glow"></div>
  <main class="wrap">
    <header class="head">
      <div class="head-icon">💬</div>
      <h1 class="title">YFD 产品售后中心</h1>
      <p class="subtitle">感谢您的支持，如需帮助请通过以下方式联系我们</p>
    </header>

    <!-- 邮箱区 -->
    <section class="card">
      <h2 class="card-title"><span class="dot"></span>客服邮箱</h2>
      <p class="card-hint">点击右侧按钮即可复制邮箱地址</p>
      <ul class="email-list">
        <li class="email-item">
          <span class="email-text">3606497903@qq.com</span>
          <button class="copy-btn" onclick="copyEmail('3606497903@qq.com', this)">复制</button>
        </li>
        <li class="email-item">
          <span class="email-text">3572620366@qq.com</span>
          <button class="copy-btn" onclick="copyEmail('3572620366@qq.com', this)">复制</button>
        </li>
        <li class="email-item">
          <span class="email-text">1659281614@qq.com</span>
          <button class="copy-btn" onclick="copyEmail('1659281614@qq.com', this)">复制</button>
        </li>
      </ul>
    </section>

    <!-- 群聊区 -->
    <section class="card">
      <h2 class="card-title"><span class="dot"></span>官方售后群</h2>
      <p class="card-hint">扫描二维码或点击按钮加入 QQ 群，获取一对一售后服务</p>
      <div class="qr-box">
        <img src="qrcode.png" alt="YFD产品售后群二维码" class="qr-img" />
        <div class="group-name">YFD产品售后群</div>
        <div class="group-id">群号：891654570</div>
      </div>
      <a class="join-btn" href="https://qm.qq.com/q/ooHRij2Sas" target="_blank" rel="noopener">
        <span class="qq-icon">🐧</span> 点击加入群聊
      </a>
    </section>

    <footer class="foot">
      <p>&copy; 2025 YFD 产品售后中心 · 用心服务每一位用户</p>
    </footer>
  </main>

  <!-- 复制成功提示 -->
  <div class="toast" id="toast">✅ 已复制到剪贴板</div>

  <script src="app.js"></script>
</body>
</html>
